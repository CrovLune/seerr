---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish Zeus image

on:
  push:
    branches:
      - codex/trakt-household

permissions:
  contents: read

concurrency:
  group: publish-zeus-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish linux/amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read commit timestamp
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'timestamp=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.commit.outputs.timestamp }}
          tags: ghcr.io/crovlune/seerr:3.4.1-trakt.1
          provenance: false

      - name: Record immutable reference
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$IMAGE_DIGEST" |
            grep -E '^sha256:[0-9a-f]{64}$'
          printf 'Image: `ghcr.io/crovlune/seerr@%s`\n' "$IMAGE_DIGEST" \
            >> "$GITHUB_STEP_SUMMARY"
